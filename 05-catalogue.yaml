- name: configuring catalogue server
  hosts: local
  become: yes
  tasks:
    - name: disable default nodejs
      command: dnf module disable nodejs -y
    - name: enable nodejs24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:
        name: nodejs
        state: present

    - name: create roboshop system user
      user:
        name: roboshop
        shell: /sbin/nologin
        create_home: false
        home: /app
        comment: roboshop system user
        system: true

    - name: delete the /app dir - deleting old code
      file:
        path: /app
        state: absent

    - name: remove catalogue.zip
      file:
        path: /tmp/catalogue.zip
        state: absent

    - name: create /app dir
      file:
        path: /app
        state: directory # if not file will be created

    - name: download app zip
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name: unzip catalogue app
      unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: install dependencies
      community.general.npm:
        path: /app

    - name: copy service file
      template:
        src: catalogue.service.j2 # jinja2
        dest: /etc/systemd/system/catalogue.service

    - name: daemon reload catalogue
      systemd_service:
        name: catalogue
        state: started

    - name: enable and start catalogue
      service:
        name: catalogue
        state: started
        enabled: yes

    - name: copy mongo repo file
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongodb client
      package:
        name: mongodb-mongosh
        state: present

    - name: check if products data exists
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count

    - name: see the products count
      debug:
        msg: "{{ product_count }}"

    - name: load products
      shell: mongosh --host "{{ mongodb_host }}" </app/db/master-data.js
      when: product_count.stdout | int == 0

    - name: daemon reload catalogue
      systemd_service:
        name: catalogue
        state: started

    - name: enable and start catalogue
      service:
        name: catalogue
        state: started
        enabled: yes
