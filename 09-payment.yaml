- name: configure payment
  hosts: payment
  become: yes
  tasks:
    - name: install python3.9
      dnf:
        name:
          - python3.14
          - python3.14-pip
        state: present

    - name: create system user
      user:
        system: true
        home: /app
        shell: /sbin/nologin
        comment: roboshop system user
        name: roboshop
        create_home: false
        state: present

    - name: remove old code
      file:
        path: /app
        state: absent

    - name: remove zip
      file:
        path: /tmp/payment.zip
        state: absent

    - name: create /app dir
      file:
        path: /app
        state: directory

    - name: downlaod payment zip
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
        dest: /tmp/payment.zip

    - name: install python dependencies in virtual env
      ansible.builtin.pip:
        requirements: /app/requirements.txt
        virtualenv: /app/.venv
        virtualenv_command: python3.14 -m venv

    - name: copy j2 service to /etc/systemd/system/payment.service
      copy:
        src: payment.service.j2
        dest: /etc/systemd/system/payment.service

    - name: daemon reload
      systemd_service:
        daemon_reload: true

    - name: enable and start payemnt
      service:
        name: payment
        state: started
        enabled: yes
