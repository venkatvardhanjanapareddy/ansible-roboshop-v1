- name: configure rabbimq server
  hosts: rabbitmq
  become: yes
  tasks:
    - name: copy repo file to /etc/yum.repos.d/rabbitmq.repo
      copy:
        src: rabbitmq.repo
        dest: /etc/yum.repos.d/rabbitmq.repo

    - name: install rabbitmq
      dnf:
        name:
          - erlang
          - rabbitmq-server
        state: present

    - name: enable and start rabbitmq
      service:
        name: rabbitmq-server
        state: started
        enabled: yes

    - name: check if user exists
      community.rabbitmq.rabbitmq_user:
        user: roboshop
        password: roboshop123
        vhost: /
        configure_priv: .*
        read_priv: .*
        write_priv: .*
        state: present
