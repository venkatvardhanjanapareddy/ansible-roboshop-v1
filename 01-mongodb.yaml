- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
    - name: copy mongo repo to /etc/yum.repos.d/mongo.repo
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongo-org
      package:
        name: mongodb-org
        state: present

    - name: start mongodb
      service:
        name: mongod
        state: started
        enabled: true

    - name: change localhost access to everyone
      replace:
        path: /etc/mongod.conf
        regexp: "127.0.0.1"
        replace: "0.0.0.0"

    - name: restart service mongod
      service:
        name: mongod
        state: restarted
