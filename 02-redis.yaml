- name: configure redis server
  hosts: redis
  become: yes
  tasks:
    - name: enable redis:7
      command: dnf module enable redis:7 -y

    - name: Install redis
      package:
        name: redis
        state: present

    - name: change localhost access to all
      replace:
        path: /etc/redis/redis.conf
        regexp: "127.0.0.1"
        replace: "0.0.0.0"

    - name: change protected mode yes to no
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "protected-mode yes"
        line: "protected-mode no"

    - name: starte and enable redis
      service:
        name: redis
        state: started
        enabled: yes
