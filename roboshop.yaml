- name: launch ec2 and update/create route53
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    event: create
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
  tasks:
    - name: launch ec2
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type  }}"
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: event == "create"
      register: ec2_output

    - name: print ec2 output
      debug:
        msg: "{{ ec2_output }}"
