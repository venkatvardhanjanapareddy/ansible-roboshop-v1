- name: launch ec2 and update/create route53
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    event: create
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
    domain_name: vardhandaws.online
  tasks:
    - name: launch ec2
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type  }}"
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: event == "create"
      register: ec2_output

    # - name: print ec2 output
    #   debug:
    #     msg: "{{ ec2_output }}"

    - name: Update route53 records
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        record: "{{ item.item}}.{{ domain_name }}"
        state: present
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: event == "create"

    - name: Update route53 records for frontend
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        state: present
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: event == "create" and item.item == "frontend"

    - name: delete route53 record
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        record: "{{ item.item}}.{{ domain_name }}"
        state: absent
        ttl: 1
        type: A
      loop: "{{ ec2_output.results }}"
      when: event == "delete"

    - name: delete route53 record
      amazon.aws.route53:
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        state: absent
        ttl: 1
        type: A
      when: event == "delete"

    - name: delete ec2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        state: absent
        region: us-east-1
      loop: "{{ instances }}"
      when: event == "delete"
