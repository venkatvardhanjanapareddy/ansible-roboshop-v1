- name: configure shipping service
  hosts: shipping
  become: yes
  tasks:
    - name: enable maven:3.9
      command: dnf module enable maven:3.9 -y

    - name: install java25 and maven
      dnf:
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25 # installing this package so no need to set the JAVA_HOME
          - mysql

    - name: add system user
      user:
        name: roboshop
        comment: roboshop system user
        shell: /sbin/nologin
        create_home: false
        home: /app
        system: true
        state: present

    - name: Delete old /app
      file:
        path: /app
        state: absent

    - name: delete zip file
      file:
        path: /tmp/shipping.zip
        state: absent

    - name: Create /app dir
      file:
        path: /app
        state: directory

    - name: download zip
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: unzip the files
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: check mvn version without JAVA_HOME
      command: mvn -v
      args:
        chdir: /app
      register: mvn_version

    - name: print the version
      debug:
        msg: "{{ mvn_version.stdout_lines}}"

    - name: build shipping
      command: mvn clean package
      args:
        chdir: /app

    - name: move shipping.jar
      command: mv target/shipping.jar shipping.jar # reason for moving is if any user runs mvn clean then the file is target folder will be lost
      args:
        chdir: /app

    - name: check citites data exist
      command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
      register: cities_count
      ignore_errors: true

    - name: print cities count
      debug:
        msg: "{{ cities_count }}"

    - name: load citties data to mysql
      command: mysql -h "{{mysql_host}}" -uroot -p{{mysql_root_password}} < /app/db/master-data.sql
      when: cities_count.rc != 0 or cities_count.stdout | int == 0

    - name: create app user in mysql
      shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/app-user.sql
      tags:
        - mysql

    - name: copy shipping service
      template:
        src: shipping.service.j2
        dest: /etc/systemd/system/shipping.service

    - name: daemon reload
      systemd_service:
        daemon_reload: true

    - name: start and enable shipping
      service:
        name: shipping
        state: restarted
        enabled: yes
