- name: configure shipping service
  hosts: shipping
  become: yes
  tasks:
    - name: enable maven:3.9
      command: dnf module enable maven:3.9 -y

    - name: install java25 and maven
      dnf:
        name:
          - maven
          - java-25-openjdk-devel
          - maven-openjdk25 # installing this package so no need to set the JAVA_HOME

    - name: add system user
      user:
        name: roboshop
        comment: roboshop system user
        shell: /sbin/nologin
        create_home: false
        home: /app
        system: true
        state: present

    - name: Delete old /app
      file:
        path: /app
        state: absent

    - name: delete zip file
      file:
        path: /tmp/shipping.zip
        state: absent

    - name: Create /app dir
      file:
        path: /app
        state: directory

    - name: download zip
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: unzip the files
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: check mvn version without JAVA_HOME
      command: mvn -v
      args:
        chdir: /app
      register: mvn_version

    - name: print the version
      debug:
        msg: "{{ mvn_version}}"
